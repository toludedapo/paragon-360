<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
</head>
<body>
<title>Paragon Hostel 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=Gloock&display=swap">
<style>
/* Layout: full-screen panorama, title chip top-left, time-of-day switch docked bottom. Single dark look by choice. */
:root{
  --ink:#0d0f12; --glass:rgba(13,15,18,.72); --line:rgba(236,231,222,.18);
  --text:#ece7de; --muted:#a9a297; --laterite:#c8643b; --night:#6f8fd8;
  --display:"Gloock",Georgia,serif; --ui:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#pano{position:fixed;inset:0;background:var(--ink)}
/* minimal Pannellum shell (its own stylesheet can't load here) */
.pnlm-container{margin:0;padding:0;overflow:hidden;position:relative;width:100%;height:100%;touch-action:none;outline:0}
.pnlm-ui,.pnlm-render-container,.pnlm-dragfix{position:absolute;inset:0;width:100%;height:100%}
.pnlm-ui{z-index:1}
.pnlm-grab{cursor:grab}.pnlm-grabbing{cursor:grabbing}
.pnlm-controls-container,.pnlm-load-box,.pnlm-info-box,.pnlm-about-msg,.pnlm-panorama-info,.pnlm-error-msg,.pnlm-compass,.pnlm-orientation-button,.pnlm-load-button,.pnlm-hot-spot-debug-indicator,.pnlm-tooltip,.pnlm-sprite{display:none!important}

.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:5;pointer-events:none}
.chip{pointer-events:auto;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.selwrap{position:relative;display:flex;align-items:center;gap:6px;margin-top:2px}
.selwrap svg{position:absolute;right:0;pointer-events:none;color:var(--muted)}
#spotSel{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--text);font-family:var(--display);font-size:22px;line-height:1.15;padding:0 22px 0 0;cursor:pointer;max-width:70vw}
#spotSel option{background:#16191e;color:var(--text);font-family:var(--ui);font-size:16px}
#spotSel:focus-visible{outline:2px solid var(--laterite);outline-offset:3px;border-radius:4px}
h1{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--laterite);outline-offset:2px}

.dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5;display:flex;flex-direction:column;gap:8px;align-items:center}
.caption{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.4;max-width:34rem;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.caption b{font-weight:600}
.seg{display:flex;gap:4px;padding:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:100%}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--ui);padding:11px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.seg button[data-state="dusk"][aria-pressed="true"] .dot{background:var(--laterite)}
.seg button[data-state="blackout"][aria-pressed="true"] .dot{background:var(--night)}
.hint{font-size:12px;color:var(--muted);text-shadow:0 1px 3px #000}
.label{font-size:11px;color:var(--muted);text-shadow:0 1px 3px #000}

.pnlm-hotspot-base{position:absolute;visibility:hidden;top:0;z-index:1;cursor:pointer}
.walk{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
.walk .ring{width:58px;height:58px;border-radius:50%;background:rgba(13,15,18,.55);border:2px solid rgba(236,231,222,.9);display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.45);transition:transform .15s}
.walk:hover .ring{transform:scale(1.08)}
.walk .ring svg{color:var(--text)}
.walk .tag{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:600 12.5px/1 var(--ui);color:var(--text);white-space:nowrap;text-shadow:none}
.walk.up .ring{border-color:var(--laterite)}
#status{position:fixed;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;font-size:14px;color:var(--muted)}
@media (max-width:380px){.seg button{padding:10px 10px;font-size:13px}#spotSel{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="pano" aria-label="360 degree view, drag to look around"></div>
<div id="status">Loading view…</div>

<header class="top">
  <div class="chip">
    <div class="eyebrow">Paragon Hostel · UNILORIN</div>
    <label class="visually-hidden" for="spotSel">Choose a place</label>
    <div class="selwrap"><select id="spotSel"></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>
  </div>
  <button class="iconbtn" id="fsBtn" type="button" aria-label="Full screen" title="Full screen">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</header>

<div class="dock">
  <div class="caption" id="caption"></div>
  <div class="seg" role="group" aria-label="Time of day">
    <button type="button" id="b-noon" data-state="noon" aria-pressed="false"><span class="dot"></span>Noon</button>
    <button type="button" id="b-dusk" data-state="dusk" aria-pressed="true"><span class="dot"></span>7 pm</button>
    <button type="button" id="b-blackout" data-state="blackout" aria-pressed="false"><span class="dot"></span>1 am blackout</button>
  </div>
  <div class="hint">Drag to look around · tap a circle to walk · pinch to zoom</div>
  <div class="label">Concept visualisation from the project model, not approved for construction</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
const SPOTS = [
  {id:"aerial",    name:"Aerial view",          states:["noon","dusk"]},
  {id:"front",     name:"Front view",           states:["noon","dusk","blackout"]},
  {id:"entrance",  name:"Entrance",             states:["noon","dusk"]},
  {id:"reception", name:"Reception",            states:["noon","dusk"]},
  {id:"reading",   name:"Reading room",         states:["noon","dusk"]},
  {id:"stairb",    name:"Staircase B",          states:["noon","dusk","blackout"]},
  {id:"gangway",   name:"First-floor corridor", states:["noon","dusk","blackout"]},
  {id:"balconyff", name:"Upstairs balcony",     states:["noon","dusk"]},
  {id:"balconygf", name:"Downstairs walkway",   states:["noon","dusk","blackout"]},
  {id:"four",      name:"Room of Four",         states:["noon","dusk","blackout"]},
  {id:"roomtwo",   name:"Room of Two",          states:["noon","dusk"]},
  {id:"laundry",   name:"Laundry",              states:["noon","dusk"]},
  {id:"inverter",  name:"Inverter room",        states:["noon","dusk"]},
  {id:"courtyard", name:"Courtyard",            states:["noon","dusk","blackout"]}
];
const TEXT = {
  noon:     "<b>12:00, daylight.</b> Solar runs the hostel and charges the battery.",
  dusk:     "<b>7 pm, lights and fans on.</b> The sun has set; the 150 kWh battery carries the load.",
  blackout: "<b>1 am, battery at 20%.</b> The inverter has cut off. Only the emergency lights stay on until the sun returns at about 8 am."
};
const TEXT_SPOT = {
  "four:blackout": "<b>1 am, battery at 20%.</b> The inverter has cut off, so the room stays dark until the sun returns at about 8 am.",
  "inverter:noon": "<b>12:00.</b> Solar charging the 10 × 15 kWh battery bank.",
  "inverter:dusk": "<b>7 pm.</b> The battery bank now supplies the whole hostel.",
  "aerial:noon": "<b>12:00, the whole site.</b> 75 kWp of solar panels on the roofs power the hostel by day.",
  "front:blackout": "<b>1 am, battery at 20%.</b> The inverter has cut off; only moonlight and the exit signs remain until about 8 am."
};
// Camera data from Unreal (metres; yaw = world yaw of the panorama centre, 0 = +X, 90 = +Y)
const CAM = {
  aerial:{x:-23.13,y:5.90,z:15.00,yaw:0}, front:{x:4.325,y:38.50,z:1.615,yaw:-90},
  entrance:{x:-7.00,y:22.45,z:2.20,yaw:0}, reception:{x:3.00,y:21.50,z:2.20,yaw:-115},
  reading:{x:4.34,y:20.44,z:5.66,yaw:-90}, stairb:{x:11.20,y:15.90,z:4.02,yaw:0},
  gangway:{x:-4.90,y:13.00,z:5.65,yaw:-90}, balconyff:{x:7.08,y:1.24,z:5.73,yaw:-90},
  balconygf:{x:7.08,y:1.24,z:1.60,yaw:-90}, four:{x:-8.60,y:18.68,z:2.20,yaw:90},
  roomtwo:{x:-16.46,y:18.68,z:2.20,yaw:90}, laundry:{x:43.00,y:28.50,z:2.05,yaw:-90},
  inverter:{x:6.01,y:14.90,z:5.65,yaw:90}, courtyard:{x:4.32,y:-12.00,z:1.60,yaw:90}
};
const CAM_STATE = {"aerial_dusk":{x:4.32,y:30.00,z:15.00,yaw:-90}};   // aerial dusk was rendered from the old spot
const LINKS = [["front","entrance"],["entrance","reception"],["entrance","laundry"],["reception","stairb"],
  ["reception","four"],["four","roomtwo"],["reception","balconygf"],["balconygf","courtyard"],["stairb","gangway"],
  ["stairb","inverter"],["gangway","inverter"],["gangway","reading"],["stairb","reading"],["stairb","balconyff"]];
const ONEWAY = [["aerial","front"],["aerial","courtyard"]];
const MIRROR = 1;   // set to -1 if every arrow points the opposite way
const wrap = a => ((a + 540) % 360) - 180;
const deg = r => r * 180 / Math.PI;
const byId = id => SPOTS.find(s => s.id === id);
function camFor(id, st){ return CAM_STATE[id+"_"+st] || CAM[id]; }
function stateFor(sp, st){ return sp.states.includes(st) ? st : (sp.states.includes("dusk") ? "dusk" : sp.states[0]); }
function neighbours(id){
  const n = [];
  LINKS.forEach(([a,b]) => { if (a===id) n.push(b); if (b===id) n.push(a); });
  ONEWAY.forEach(([a,b]) => { if (a===id) n.push(b); });
  return n;
}
function hotspotsFor(id, st){
  const c = camFor(id, st);
  return neighbours(id).map(t => {
    const tc = CAM[t];
    const dx = tc.x - c.x, dy = tc.y - c.y, dz = tc.z - c.z, dist = Math.hypot(dx, dy) || 0.01;
    const bearing = deg(Math.atan2(dy, dx));
    let pitch = deg(Math.atan2(dz, dist));
    pitch = id === "aerial" ? pitch : Math.max(-40, Math.min(25, pitch - 14));
    const up = dz > 1, down = dz < -1;
    return {pitch, yaw: MIRROR * wrap(bearing - c.yaw), cssClass: "walkhs", target: t, travel: bearing, up, down,
      createTooltipFunc: makeArrow, createTooltipArgs: {name: byId(t).name, up, down},
      clickHandlerFunc: (e, args) => walkTo(t, bearing), clickHandlerArgs: {}};
  });
}
function makeArrow(div, a){
  div.classList.add("walk");
  if (a.up) div.classList.add("up");
  const icon = a.up ? '<path d="M6 15l6-6 6 6"/><path d="M6 20l6-6 6 6" opacity=".45"/>'
             : a.down ? '<path d="M6 9l6 6 6-6"/><path d="M6 4l6 6 6-6" opacity=".45"/>'
             : '<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>';
  div.innerHTML = '<div class="ring"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+icon+'</svg></div><div class="tag">'+a.name+(a.up?" (upstairs)":a.down?" (downstairs)":"")+'</div>';
  div.setAttribute("role","button"); div.setAttribute("aria-label","Go to "+a.name);
}
const scenes = {};
for (const sp of SPOTS) for (const st of sp.states)
  scenes[sp.id+"_"+st] = {type:"equirectangular", panorama: sp.id+"_"+st+".jpg", hfov:105, pitch:-5, yaw:0, hotSpots: hotspotsFor(sp.id, st)};

const status = document.getElementById("status");
let spot = SPOTS.find(s=>s.id==="aerial"), state = "noon";
try { const h = location.hash.slice(1); const f = SPOTS.find(s=>s.id===h); if (f) spot = f; } catch(e) {}

const sel = document.getElementById("spotSel");
SPOTS.forEach(sp => { const o=document.createElement("option"); o.value=sp.id; o.textContent=sp.name; sel.appendChild(o); });

function render(){
  sel.value = spot.id;
  document.getElementById("caption").innerHTML = TEXT_SPOT[spot.id+":"+state] || TEXT[state];
  document.querySelectorAll(".seg button").forEach(b => {
    b.hidden = !spot.states.includes(b.dataset.state);
    b.setAttribute("aria-pressed", b.dataset.state === state ? "true" : "false");
  });
}
let viewer = null;
if (window.pannellum) {
  viewer = pannellum.viewer("pano", {
    default:{firstScene: spot.id+"_"+state, autoLoad:true, sceneFadeDuration:500, showControls:false, compass:false, minHfov:45, maxHfov:120, friction:0.2},
    scenes
  });
  viewer.on("load", () => { status.hidden = true; });
  viewer.on("error", () => { status.hidden = false; status.textContent = "This view couldn't load. Reload the page to try again."; });
} else { status.textContent = "The 360 viewer couldn't load. Check your connection and reload."; }
render();

function go(newSpot, newState, keepView, faceYaw){
  if (!newSpot.states.includes(newState)) newState = newSpot.states.includes("dusk") ? "dusk" : newSpot.states[0];
  if (newSpot === spot && newState === state) return;
  spot = newSpot; state = newState; render();
  try { history.replaceState(null, "", "#"+spot.id); } catch(e) {}
  if (!viewer) return;
  status.hidden = false; status.textContent = "Loading view…";
  if (keepView) viewer.loadScene(spot.id+"_"+state, "same", "same", "same");
  else if (faceYaw !== undefined) viewer.loadScene(spot.id+"_"+state, -5, faceYaw, 105);
  else viewer.loadScene(spot.id+"_"+state);
}
let walking = false;
function walkTo(t, travelBearing){
  if (walking || !viewer) return;
  walking = true;
  const sp = byId(t), st = stateFor(sp, state), c = camFor(t, st);
  const face = MIRROR * wrap(travelBearing - c.yaw);
  const hs = (scenes[spot.id+"_"+state].hotSpots || []).find(h => h.target === t);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (hs && !reduce) viewer.lookAt(Math.max(hs.pitch, -10), hs.yaw, 60, 450);
  setTimeout(() => { go(sp, st, false); walking = false; }, reduce ? 0 : 470);
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => go(spot, b.dataset.state, true)));
sel.addEventListener("change", () => go(SPOTS.find(s=>s.id===sel.value), state, false));
window.addEventListener("hashchange", () => { const f = SPOTS.find(s=>s.id===location.hash.slice(1)); if (f) go(f, state, false); });

const fsBtn = document.getElementById("fsBtn");
const root = document.documentElement;
if (!root.requestFullscreen && !root.webkitRequestFullscreen) fsBtn.hidden = true;
fsBtn.addEventListener("click", () => {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      if (p && p.catch) p.catch(() => { fsBtn.hidden = true; });
    }
  } catch (e) { fsBtn.hidden = true; }
});
</script>

</body>
</html>
